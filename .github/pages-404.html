<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting</title>
    <script>
      (function () {
        var parts = window.location.pathname.split('/').filter(Boolean)
        var keep = 0
        if (parts[0] === 'board-game-shelf') {
          keep = parts[1] === 'staging' ? 2 : 1
        } else if (parts[0] === 'staging') {
          keep = 1
        }
        var rest =
          '/' +
          parts.slice(keep).join('/') +
          window.location.search +
          window.location.hash
        try {
          sessionStorage.setItem('spa-github-pages-path', rest)
        } catch (e) {}
        var l = window.location
        var prefix = l.pathname.split('/').slice(0, 1 + keep).join('/')
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            prefix +
            '/?/' +
            l.pathname
              .split('/')
              .slice(1 + keep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
