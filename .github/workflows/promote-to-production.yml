# Fast-forward production (`main`) to the current tip of `staging`.
#
# After this job runs, `main` and `staging` point at the same commit.
# GitHub Pages then publishes from that commit (production at the site
# root, staging under /staging/).
#
# Uses the default GITHUB_TOKEN (no PAT). That only works if Protect
# main does NOT require a pull request and does NOT restrict updates.
# Keep "block force pushes" on: this job only fast-forwards. See AGENTS.md.
#
# GITHUB_TOKEN pushes do not trigger other on.push workflows, so this
# job also dispatches Deploy GitHub Pages.

name: Promote staging to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to point main at the current staging commit'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm promote
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "promote" ]; then
            echo '::error::Type "promote" in the confirm input to cut main from staging.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward main to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin staging main
          STAGING_SHA=$(git rev-parse origin/staging)
          MAIN_SHA=$(git rev-parse origin/main)
          echo "staging=$STAGING_SHA"
          echo "main=$MAIN_SHA"
          if [ "$STAGING_SHA" = "$MAIN_SHA" ]; then
            echo "main already matches staging; nothing to push."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$MAIN_SHA" "$STAGING_SHA"; then
            echo "::error::main is not an ancestor of staging, so this would not be a fast-forward. Force-push is blocked. Merge main into staging (or otherwise put main's commits on staging) and run promote again."
            exit 1
          fi
          if ! git push origin "$STAGING_SHA:refs/heads/main"; then
            echo "::error::Push to main was rejected. On Protect main, turn off Require a pull request and do not enable Restrict updates. Keep Restrict deletions and Block force pushes. See AGENTS.md."
            exit 1
          fi

      - name: Deploy GitHub Pages from the new main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Deploy GitHub Pages" --ref main
