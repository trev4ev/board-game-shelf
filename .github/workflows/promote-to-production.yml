# Cut production (`main`) to the current tip of `staging`.
#
# `main` is not updated by PRs. After this job runs, `main` and
# `staging` point at the same commit. GitHub Pages then publishes from
# that commit (production at the site root, staging under /staging/).
#
# The default GITHUB_TOKEN is github-actions[bot], which cannot be a
# ruleset bypass actor on a personal repo. This job pushes with
# secrets.PROMOTE_TOKEN (a fine-grained PAT for the repo owner) so the
# push matches the Repository admin bypass on Protect main. See AGENTS.md.

name: Promote staging to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to point main at the current staging commit'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm promote
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "promote" ]; then
            echo '::error::Type "promote" in the confirm input to cut main from staging.'
            exit 1
          fi

      - name: Require PROMOTE_TOKEN
        env:
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PROMOTE_TOKEN" ]; then
            echo '::error::Add repository secret PROMOTE_TOKEN (fine-grained PAT, Contents: Read and write) and add Repository admin as a Protect main bypass actor. The built-in GitHub Actions app is not a bypass option on a personal repo. See AGENTS.md.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Point main at staging
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin staging main
          STAGING_SHA=$(git rev-parse origin/staging)
          MAIN_SHA=$(git rev-parse origin/main)
          echo "staging=$STAGING_SHA"
          echo "main=$MAIN_SHA"
          if [ "$STAGING_SHA" = "$MAIN_SHA" ]; then
            echo "main already matches staging; nothing to push."
          else
            if ! git push --force-with-lease="refs/heads/main:$MAIN_SHA" \
              origin "$STAGING_SHA:refs/heads/main"; then
              echo "::error::Push to main was rejected. Add Repository admin as a Protect main bypass actor (Always allow), and set secret PROMOTE_TOKEN to a fine-grained PAT for that admin with Contents read/write. See AGENTS.md."
              exit 1
            fi
          fi

      - name: Deploy GitHub Pages from the new main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Deploy GitHub Pages" --ref main
