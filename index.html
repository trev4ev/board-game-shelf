<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Board Game Shelf</title>
    <script>
      /* spa-github-pages-restore */
      (function (l) {
        var path = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname
        function forgetStored() {
          try {
            sessionStorage.removeItem('spa-github-pages-path')
          } catch (e) {}
        }
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          forgetStored()
          window.history.replaceState(null, '', path + decoded + l.hash)
          return
        }
        try {
          var stored = sessionStorage.getItem('spa-github-pages-path')
          if (stored && stored.charAt(0) === '/') {
            forgetStored()
            window.history.replaceState(null, '', path + stored)
          }
        } catch (e) {}
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
